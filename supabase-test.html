<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test - Ken Barbershop</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #c4a052; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .btn { background: #c4a052; color: #1a1a1a; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
        pre { background: #222; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Supabase Connection Test</h1>

        <div class="card">
            <h2>1. Connection Status</h2>
            <div id="connStatus">Testing...</div>
        </div>

        <div class="card">
            <h2>2. Test Insert Data</h2>
            <button class="btn" onclick="insertTestData()">Insert Test Banners</button>
            <pre id="insertResult"></pre>
        </div>

        <div class="card">
            <h2>3. Test Read Data</h2>
            <button class="btn" onclick="readData()">Read Banners</button>
            <pre id="readResult"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://xjpxjbmpsimnkzwnlmxp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqcHhqYm1wc2ltbmt6d25sbXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTUzNjQsImV4cCI6MjA5MzczMTM2NH0.3jHlF-_e1cUveKSPblWPuPqfoXVPSCh2bqWZUxWCu4c';

        // Check if key format is correct
        const isAnonKey = supabaseKey.startsWith('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9');

        async function testConnection() {
            const statusEl = document.getElementById('connStatus');

            if (!isAnonKey) {
                statusEl.innerHTML = '<span class="error">❌ Key format không đúng. Cần anon key (bắt đầu bằng eyJ...)</span>';
                return;
            }

            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });

                if (response.ok) {
                    statusEl.innerHTML = '<span class="success">✅ Kết nối Supabase thành công!</span>';
                } else {
                    statusEl.innerHTML = `<span class="error">❌ Lỗi: ${response.status} ${response.statusText}</span>`;
                }
            } catch (error) {
                statusEl.innerHTML = `<span class="error">❌ Lỗi kết nối: ${error.message}</span>`;
            }
        }

        async function insertTestData() {
            const resultEl = document.getElementById('insertResult');
            resultEl.textContent = 'Inserting...';

            // Demo URLs (placeholder - sẽ thay bằng Cloudinary URLs)
            const testBanners = [
                {
                    url: 'https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=1200',
                    alt: 'Ken Barbershop Banner 1',
                    active: true,
                    sort_order: 1
                },
                {
                    url: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=1200',
                    alt: 'Ken Barbershop Banner 2',
                    active: true,
                    sort_order: 2
                }
            ];

            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/banners`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(testBanners)
                });

                if (response.ok || response.status === 201) {
                    resultEl.textContent = '✅ Inserted 2 test banners successfully!';
                } else {
                    const error = await response.text();
                    resultEl.textContent = '❌ Error: ' + error;
                }
            } catch (error) {
                resultEl.textContent = '❌ Error: ' + error.message;
            }
        }

        async function readData() {
            const resultEl = document.getElementById('readResult');
            resultEl.textContent = 'Reading...';

            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/banners?select=*&order=sort_order`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } else {
                    const error = await response.text();
                    resultEl.textContent = '❌ Error: ' + error;
                }
            } catch (error) {
                resultEl.textContent = '❌ Error: ' + error.message;
            }
        }

        // Run test on load
        testConnection();
    </script>
</body>
</html>
